<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{box-sizing:border-box;width:1200px;height:630px;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper)}
.og h1{font-size:82px;line-height:.98;letter-spacing:-.03em;font-weight:400;max-width:900px;margin:0}
.og .bot{display:flex;justify-content:space-between;align-items:flex-end;border-top:3px double var(--ink);padding-top:22px}
.og .bot p{margin:0;font:500 15px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.og .wm span{font-size:30px}.og .wm small{font-size:12px}
</style></head><body><div class="og">
<div class="wm"><small>Calgary</small><span>Accountant Match</span></div>
<h1>Find the <span class="dbl-u">right</span> accountant for your Calgary business.</h1>
<div class="bot"><p>For incorporated professionals and owner-managers</p><p>Free introductions</p></div>
</div></body></html>
